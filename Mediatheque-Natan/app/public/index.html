<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <title>Médiathèque NATAN</title>
  
  <!-- Favicon -->
  <link rel="icon" href="icon.png" type="image/png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Meta -->
  <meta name="description" content="Gestion intelligente de CDs, DVDs et Blu-rays avec profilage utilisateur et recommandations">
  <meta name="author" content="Nathalie FALSIMAGNE - NATAN Consulting">
  <meta name="theme-color" content="#D90429">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Médiathèque NATAN">
  <meta property="og:description" content="Gestion intelligente de votre collection de médias physiques">
  <meta property="og:type" content="website">
  
  <!-- Styles -->
  <style>
    :root {
      --bg-primary: #1A1B2E;
      --bg-secondary: #2B2D42;
      --bg-tertiary: #4A4D6A;
      --text-primary: #E9ECEF;
      --text-secondary: #8D99AE;
      --text-tertiary: #495057;
      --accent: #D90429;
      --accent-light: #EF233C;
      --success: #27AE60;
      --info: #2980B9;
      --warning: #F2994A;
      --danger: #EB5757;
      --border: #DEE2E6;
      --shadow: rgba(0, 0, 0, 0.1);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    /* Loading screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 64px;
      height: 64px;
      border: 4px solid var(--bg-tertiary);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 16px;
      color: var(--text-secondary);
      font-size: 16px;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
    
    /* Selection */
    ::selection {
      background: var(--accent);
      color: white;
    }
    
    /* Focus */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    
    /* Utility classes */
    .text-primary { color: var(--text-primary); }
    .text-secondary { color: var(--text-secondary); }
    .text-tertiary { color: var(--text-tertiary); }
    .bg-primary { background: var(--bg-primary); }
    .bg-secondary { background: var(--bg-secondary); }
    .bg-tertiary { background: var(--bg-tertiary); }
    .bg-accent { background: var(--accent); }
    .text-accent { color: var(--accent); }
    .border-accent { border-color: var(--accent); }
    
    /* Dark mode */
    .dark {
      --bg-primary: #1A1B2E;
      --bg-secondary: #2B2D42;
      --bg-tertiary: #4A4D6A;
      --text-primary: #E9ECEF;
      --text-secondary: #8D99AE;
      --text-tertiary: #495057;
    }
    
    /* Light mode */
    .light {
      --bg-primary: #F8F9FA;
      --bg-secondary: #FFFFFF;
      --bg-tertiary: #E9ECEF;
      --text-primary: #2B2D42;
      --text-secondary: #4A4D6A;
      --text-tertiary: #8D99AE;
      --border: #DEE2E6;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">Chargement de Médiathèque NATAN...</div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="renderer.js"></script>
</body>
</html>
